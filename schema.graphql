schema {
  query: Query
  mutation: Mutation
}

type Query {
  users: [UserDto!]! @cost(weight: "10")
  categories(
    where: CategoryDtoFilterInput @cost(weight: "10")
    order: [CategoryDtoSortInput!] @cost(weight: "10")
  ): [CategoryDto!]! @cost(weight: "10")
  categoryById(id: UUID!): CategoryDto @cost(weight: "10")
  myCart: CartDto! @cost(weight: "10")
  myOrders(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: OrderDtoFilterInput @cost(weight: "10")
    order: [OrderDtoSortInput!] @cost(weight: "10")
  ): MyOrdersConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  sellerOrders(
    sellerId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: OrderDtoFilterInput @cost(weight: "10")
    order: [OrderDtoSortInput!] @cost(weight: "10")
  ): SellerOrdersConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  orderById(id: UUID!): OrderDto @cost(weight: "10")
  productReviews(
    productId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ReviewDtoFilterInput @cost(weight: "10")
    order: [ReviewDtoSortInput!] @cost(weight: "10")
  ): ProductReviewsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  myReviews(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ReviewDtoFilterInput @cost(weight: "10")
    order: [ReviewDtoSortInput!] @cost(weight: "10")
  ): MyReviewsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  canReviewProduct(productId: UUID!): Boolean! @cost(weight: "10")
  products(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ProductDtoFilterInput @cost(weight: "10")
    order: [ProductDtoSortInput!] @cost(weight: "10")
  ): ProductsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  productById(id: UUID!): ProductDto @cost(weight: "10")
  sellerProducts(
    sellerId: UUID!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ProductDtoFilterInput @cost(weight: "10")
    order: [ProductDtoSortInput!] @cost(weight: "10")
  ): SellerProductsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  sellers(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: SellerDtoFilterInput @cost(weight: "10")
    order: [SellerDtoSortInput!] @cost(weight: "10")
  ): SellersConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  sellerById(id: UUID!): SellerDto @cost(weight: "10")
  mySellers: [SellerMembershipDto!]! @cost(weight: "10")
  sellerMembers(sellerId: UUID!): [SellerMemberDto!]! @cost(weight: "10")
}

type Mutation {
  createCategory(input: CreateCategoryDtoInput!): CategoryDto!
    @cost(weight: "10")
  updateCategory(id: UUID!, input: UpdateCategoryDtoInput!): CategoryDto
    @cost(weight: "10")
  deleteCategory(id: UUID!): Boolean! @cost(weight: "10")
  addToCart(input: AddToCartDtoInput!): CartDto! @cost(weight: "10")
  updateCartItem(input: UpdateCartItemDtoInput!): CartDto! @cost(weight: "10")
  removeFromCart(productId: UUID!): CartDto! @cost(weight: "10")
  clearCart: CartDto! @cost(weight: "10")
  checkout(input: CheckoutDtoInput!): [OrderDto!]! @cost(weight: "10")
  updateOrderDeliveryAddress(id: UUID!, input: DeliveryAddressDtoInput!): OrderDto
    @cost(weight: "10")
  shipOrder(id: UUID!): OrderDto @cost(weight: "10")
  confirmOrderDelivery(id: UUID!): OrderDto @cost(weight: "10")
  cancelOrder(id: UUID!): OrderDto @cost(weight: "10")
  createReview(input: CreateReviewDtoInput!): ReviewDto! @cost(weight: "10")
  updateReview(id: UUID!, input: UpdateReviewDtoInput!): ReviewDto
    @cost(weight: "10")
  deleteReview(id: UUID!): Boolean! @cost(weight: "10")
  createProduct(input: CreateProductDtoInput!): ProductDto! @cost(weight: "10")
  updateProduct(id: UUID!, input: UpdateProductDtoInput!): ProductDto
    @cost(weight: "10")
  activateProduct(id: UUID!): ProductDto @cost(weight: "10")
  deleteProduct(id: UUID!): Boolean! @cost(weight: "10")
  createSeller(input: CreateSellerDtoInput!): SellerDto! @cost(weight: "10")
  updateSeller(id: UUID!, input: UpdateSellerDtoInput!): SellerDto
    @cost(weight: "10")
  deleteSeller(id: UUID!): Boolean! @cost(weight: "10")
  addSellerManager(sellerId: UUID!, input: AddSellerManagerDtoInput!): SellerMemberDto!
    @cost(weight: "10")
  removeSellerMember(sellerId: UUID!, userId: UUID!): Boolean!
    @cost(weight: "10")
}

type CartDto {
  items: [CartItemDto!]!
  totalQuantity: Int!
  totalPrice: Decimal!
}

type CartItemDto {
  product: ProductDto!
  quantity: Int!
  lineTotal: Decimal!
  isAvailable: Boolean!
}

type CategoryDto {
  id: UUID!
  name: String!
}

type DeliveryAddressDto {
  recipientName: String!
  phone: String!
  country: String!
  city: String!
  addressLine: String!
  apartment: String
  postalCode: String!
  comment: String
}

"A connection to a list of items."
type MyOrdersConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [MyOrdersEdge!]
  "A flattened list of the nodes."
  nodes: [OrderDto!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type MyOrdersEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: OrderDto!
}

"A connection to a list of items."
type MyReviewsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [MyReviewsEdge!]
  "A flattened list of the nodes."
  nodes: [ReviewDto!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type MyReviewsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: ReviewDto!
}

type OrderDto {
  id: UUID!
  status: OrderStatus!
  totalAmount: Decimal!
  buyer: UserSummaryDto!
  seller: SellerDto!
  items: [OrderItemDto!]!
  deliveryAddress: DeliveryAddressDto!
  createdAt: DateTime!
  shippedAt: DateTime
  deliveredAt: DateTime
  canceledAt: DateTime
}

type OrderItemDto {
  productId: UUID!
  productName: String!
  productSku: String!
  unitPrice: Decimal!
  quantity: Int!
  lineTotal: Decimal!
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type ProductDto {
